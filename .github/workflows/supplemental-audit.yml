name: Bounded alias and neighbor audit
on:
  workflow_dispatch:
    inputs:
      source_run:
        required: true
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/scan-requirements.txt
      - run: pip install -r .github/scan-requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: tess-batch-${{ inputs.source_run }}
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
          path: prior-batch
      - uses: actions/cache@v4
        with:
          path: .cache/mast
          key: tess-mast-audit-${{ github.run_id }}
          restore-keys: tess-mast-
      - run: python -B .github/run_supplemental_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tess-audit-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
